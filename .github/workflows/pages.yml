name: Publicar SitioWeb en GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Crear archivo de publicación
        run: |
          touch SitioWeb/.nojekyll

      - name: Subir carpeta SitioWeb
        uses: actions/upload-pages-artifact@v3
        with:
          path: './SitioWeb'

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4